# Cloudflare Pages config for the Spence web app.
#
# Deploy via the @opennextjs/cloudflare adapter:
#   npm run pages:build
#   npm run pages:deploy
#
# One-time setup:
#   1. wrangler pages project create spence-web
#   2. Configure Cloudflare Access on the project domain (allow the team email
#      domain or a specific email list). CF Access injects the
#      Cf-Access-Authenticated-User-Email header which lib/auth.ts reads.
#   3. wrangler pages secret put ANTHROPIC_API_KEY
#   4. (optional) set NEXT_PUBLIC_WORKER_URL to the production mise-graph URL.
#
# Local dev does NOT use wrangler — `npm run dev` runs the standard Next.js dev
# server. Set DEV_USER_EMAIL in .env.local for the auth fallback.

name = "spence-web"
pages_build_output_dir = ".open-next/dist"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NEXT_PUBLIC_WORKER_URL = "https://mise-graph.9f745064e644311ed09914b9a12e9c7380ce62b7.workers.dev"
